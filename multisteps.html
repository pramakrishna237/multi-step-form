<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form with Drag-and-Drop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Multi-Step Form</h2>

                <!-- Multi-Step Form -->
                <form id="multiStepForm">
                    <!-- Step 1: Personal Info -->
                    <div class="step" id="step1">
                        <h4>Step 1: Personal Information</h4>
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                        <button type="button" class="btn btn-primary next-btn">
                            <i class="fa fa-arrow-right"></i>
                       </button>
                    </div>

                    <!-- Step 2: Address -->
                    <div class="step" id="step2">
                        <h4>Step 2: Address</h4>
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
                        </div>
                        <button type="button" class="btn btn-secondary prev-btn">
                            <i class="fa fa-arrow-left"></i> 
                        </button>
                        <button type="button" class="btn btn-primary next-btn">
                            <i class="fa fa-arrow-right"></i>
                       </button>
                    </div>

                    <!-- Step 3: Phone Numbers (Dynamic Fields) -->
                    <div class="step" id="step3" >
                        <h4>Step 3: Phone Numbers</h4>
                        <div id="phoneFields">
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="text" class="form-control phone-input" id="phone" placeholder="Enter phone number" required>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary prev-btn">
                            <i class="fa fa-arrow-left"></i> 
                        </button>
                        
                        <button type="button" class="btn btn-primary next-btn">
                             <i class="fa fa-arrow-right"></i>
                        </button>
                        <button type="button" class="btn btn-info" id="addPhoneField">
                            +<i class="fas fa-phone"></i> 
                        </button>
                    </div>

                    <!-- Step 4: Review and Submit -->
                    <div class="step" id="step4" >
                        <h4>Step 4: Review Information</h4>
                        <div id="review"></div>
                        <button type="button" class="btn btn-secondary prev-btn">
                            <i class="fa fa-arrow-left"></i> 
                        </button>
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
